_format_version: "3.0"

services:
  - name: hotel-api
    url: http://api:8000
    routes:
      - name: api-route
        paths:
          - /api
        strip_path: true
      - name: hotel-api-route
        paths:
          - /hotel-api
        strip_path: true

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Requested-With
      credentials: true
      max_age: 3600
  
  - name: rate-limiting
    config:
      minute: 100
      hour: 1000